<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إضافة متدرب</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">



<style>

*{
    font-family:'Cairo',sans-serif;
}


body{

    background:#f4f7fb;

}



/* Header */

.header{

    background:#06235a;

    color:white;

    padding:15px 40px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.header img{

    width:80px;

    background:white;

    border-radius:10px;

    padding:5px;

}


.header h3{

    margin:0;

}




.container-box{

    margin:40px auto;

    max-width:900px;

    background:white;

    padding:35px;

    border-radius:25px;

    box-shadow:0 10px 30px #ddd;


    animation:show .5s;


}



@keyframes show{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}





.form-control{

    height:50px;

    border-radius:12px;

}



.form-label{

    font-weight:600;

}





.btn-save{


    background:#06235a;

    color:white;

    height:50px;

    border-radius:12px;

    font-size:17px;

}



.btn-save:hover{

    background:#0b3d91;

    color:white;

}



</style>


</head>



<body>



<div class="header">


<h3>

إضافة متدرب جديد

</h3>


<img src="{{ url_for('static', filename='uploads/logo.png') }}">


</div>







<div class="container-box">



<h4 class="mb-4 text-primary">

بيانات المتدرب

</h4>




<form method="POST" enctype="multipart/form-data">



<div class="row">



<div class="col-md-6 mb-3">


<label class="form-label">

الاسم الكامل

</label>


<input

type="text"

name="full_name"

class="form-control"

required>


</div>




<div class="col-md-6 mb-3">


<label class="form-label">

رقم الهوية

</label>


<input

type="text"

name="national_id"

class="form-control">


</div>





<div class="col-md-6 mb-3">


<label class="form-label">

رقم الجوال

</label>


<input

type="text"

name="phone"

class="form-control">


</div>




<div class="col-md-6 mb-3">


<label class="form-label">

البريد الإلكتروني

</label>


<input

type="email"

name="email"

class="form-control">


</div>






<div class="col-md-6 mb-3">


<label class="form-label">

الجامعة

</label>


<input

type="text"

name="university"

class="form-control">


</div>




<div class="col-md-6 mb-3">


<label class="form-label">

التخصص

</label>


<input

type="text"

name="major"

class="form-control">


</div>





<div class="col-md-6 mb-3">


<label class="form-label">

تاريخ البداية

</label>


<input

type="date"

name="start_date"

class="form-control">


</div>





<div class="col-md-6 mb-3">


<label class="form-label">

تاريخ النهاية

</label>


<input

type="date"

name="end_date"

class="form-control">


</div>





<div class="col-md-6 mb-3">


<label class="form-label">

حالة التدريب

</label>


<select name="status" class="form-control">


<option>

مستمر

</option>


<option>

منتهي

</option>


</select>


</div>






<div class="col-md-6 mb-3">


<label class="form-label">

المشرف

</label>


<input

type="text"

name="supervisor"

class="form-control">


</div>






<div class="col-md-12 mb-4">


<label class="form-label">

صورة المتدرب

</label>


<input

type="file"

name="image"

class="form-control">


</div>




</div>





<div class="d-flex justify-content-between">


<a href="/dashboard" class="btn btn-secondary">

رجوع

</a>



<button class="btn btn-save px-5">

حفظ المتدرب

</button>



</div>




</form>


</div>



</body>


</html>
