<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام إدارة المتدربين</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">



<style>


*{
    font-family:'Cairo',sans-serif;
}


body{

    min-height:100vh;

    margin:0;

    background:

    linear-gradient(
        135deg,
        #061a40,
        #0b3d91
    );

    display:flex;

    flex-direction:column;

}



/* Header */

.header{

    height:80px;

    background:#06235a;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 50px;

}



.header img{

    height:55px;

}



.header-title{

    font-size:22px;

    font-weight:700;

}





/* Main */

.main{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px;

}




.login-card{


    width:430px;

    background:white;

    border-radius:25px;

    padding:45px;


    box-shadow:

    0 20px 50px rgba(0,0,0,.25);


    animation:show .8s ease;


}



@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}


to{

opacity:1;

transform:translateY(0);

}


}





.logo{

    text-align:center;

}



.logo img{


    width:130px;


    margin-bottom:20px;


}




h2{

    color:#06235a;

    font-weight:700;

}





.form-control{


    height:55px;

    border-radius:12px;


}



.form-control:focus{


    border-color:#0b3d91;

    box-shadow:0 0 10px rgba(11,61,145,.3);


}




.login-btn{


    height:55px;


    background:#06235a;


    color:white;


    border:none;


    border-radius:12px;


    font-size:18px;


    transition:.3s;


}



.login-btn:hover{


    background:#0b3d91;


    transform:translateY(-3px);


}




/* Footer */


.footer{


    background:#06235a;


    color:white;


    text-align:center;


    padding:18px;


    font-size:14px;


}



</style>


</head>


<body>



<div class="header">


<div class="header-title">

نظام إدارة المتدربين

</div>


<img src="{{ url_for('static', filename='uploads/logo.png') }}">


</div>





<div class="main">


<div class="login-card">



<div class="logo">


<img src="{{ url_for('static', filename='uploads/logo.png') }}">


</div>




<h2 class="text-center">

تسجيل الدخول

</h2>



<p class="text-center text-muted mb-4">

Training Registration System

</p>




<form method="POST">



<div class="mb-3">


<label>

اسم المستخدم

</label>


<input

type="text"

name="username"

class="form-control"

placeholder="أدخل اسم المستخدم">


</div>





<div class="mb-4">


<label>

كلمة المرور

</label>


<input

type="password"

name="password"

class="form-control"

placeholder="أدخل كلمة المرور">


</div>





<button class="login-btn w-100">

دخول النظام

</button>



</form>



</div>


</div>






<div class="footer">

© 2026 نظام إدارة المتدربين - جميع الحقوق محفوظة

</div>



</body>

</html>
