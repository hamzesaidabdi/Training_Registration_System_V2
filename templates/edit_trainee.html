<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعديل بيانات المتدرب</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">



<style>

*{
    font-family:'Cairo',sans-serif;
}


body{

    background:#f4f7fb;

}



.header{

    background:#06235a;

    color:white;

    padding:15px 40px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.header img{

    width:80px;

    background:white;

    padding:5px;

    border-radius:10px;

}




.form-box{

    max-width:950px;

    margin:40px auto;

    background:white;

    padding:35px;

    border-radius:25px;

    box-shadow:0 10px 30px #ddd;


}



.form-control,
.form-select{

    height:50px;

    border-radius:12px;

}



label{

    font-weight:600;

}



.btn-save{

    background:#06235a;

    color:white;

    border-radius:12px;

    padding:12px 40px;

}



.btn-save:hover{

    background:#0b3d91;

    color:white;

}



.current-image{

    width:90px;

    height:90px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid #06235a;

}


</style>


</head>


<body>



<div class="header">


<h3>

تعديل بيانات المتدرب

</h3>


<img src="{{ url_for('static', filename='uploads/logo.png') }}">


</div>






<div class="form-box">



<h4 class="text-primary mb-4">

تحديث المعلومات

</h4>



<form method="POST" enctype="multipart/form-data">



<div class="row">



<div class="col-md-6 mb-3">

<label>

الاسم الكامل

</label>

<input

type="text"

name="full_name"

class="form-control"

value="{{ trainee.full_name }}"

required>

</div>





<div class="col-md-6 mb-3">

<label>

رقم الهوية

</label>

<input

type="text"

name="national_id"

class="form-control"

value="{{ trainee.national_id }}">

</div>





<div class="col-md-6 mb-3">

<label>

رقم الجوال

</label>

<input

type="text"

name="phone"

class="form-control"

value="{{ trainee.phone }}">

</div>





<div class="col-md-6 mb-3">

<label>

البريد الإلكتروني

</label>

<input

type="email"

name="email"

class="form-control"

value="{{ trainee.email }}">

</div>





<div class="col-md-6 mb-3">

<label>

الجامعة

</label>

<input

type="text"

name="university"

class="form-control"

value="{{ trainee.university }}">

</div>





<div class="col-md-6 mb-3">

<label>

التخصص

</label>

<input

type="text"

name="major"

class="form-control"

value="{{ trainee.major }}">

</div>





<div class="col-md-6 mb-3">

<label>

تاريخ البداية

</label>

<input

type="date"

name="start_date"

class="form-control"

value="{{ trainee.start_date }}">

</div>





<div class="col-md-6 mb-3">

<label>

تاريخ النهاية

</label>

<input

type="date"

name="end_date"

class="form-control"

value="{{ trainee.end_date }}">

</div>





<div class="col-md-6 mb-3">

<label>

الحالة

</label>


<select name="status" class="form-select">


<option {% if trainee.status=="مستمر" %}selected{% endif %}>

مستمر

</option>


<option {% if trainee.status=="منتهي" %}selected{% endif %}>

منتهي

</option>


</select>


</div>





<div class="col-md-6 mb-3">

<label>

المشرف

</label>

<input

type="text"

name="supervisor"

class="form-control"

value="{{ trainee.supervisor }}">

</div>


<!-- عدد ساعات التدريب -->

<div class="col-md-6 mb-3">

<label>

عدد ساعات التدريب

</label>

<input

type="number"

name="training_hours"

class="form-control"

min="0"

value="{{ trainee.training_hours or '' }}"

placeholder="مثال: 120">

</div>





<div class="col-md-6 mb-4">


<label>

الصورة الحالية

</label>


<br>


{% if trainee.image %}

<img

src="{{ url_for('static', filename='uploads/' + trainee.image) }}"

class="current-image mb-3">

{% endif %}



<input

type="file"

name="image"

class="form-control">


</div>




</div>





<div class="d-flex justify-content-between">


<a href="/dashboard" class="btn btn-secondary">

رجوع

</a>



<button class="btn btn-save">

حفظ التعديلات

</button>


</div>





</form>



</div>




</body>

</html>
